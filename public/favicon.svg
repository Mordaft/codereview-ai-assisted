<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="neuralGrad" x1="8" y1="36" x2="40" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#87b743"/>
      <stop offset="60%" stop-color="#c4f36b"/>
      <stop offset="100%" stop-color="#e3ff99"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Base squircle para alto contraste en pestañas claras y oscuras -->
  <rect width="48" height="48" rx="12" fill="#17211f"/>
  
  <!-- Tronco de Git -->
  <path d="M8 26H16" stroke="url(#neuralGrad)" stroke-width="2.6" stroke-linecap="round"/>
  
  <!-- Nodo de commit raíz -->
  <circle cx="16" cy="26" r="2.6" fill="#17211f" stroke="#c4f36b" stroke-width="2"/>
  
  <!-- Rama superior -->
  <path d="M16 26C18 18 21 17 25 17H28" stroke="url(#neuralGrad)" stroke-width="2.3" stroke-linecap="round"/>
  <circle cx="28" cy="17" r="2.3" fill="#17211f" stroke="#c4f36b" stroke-width="1.8"/>

  <!-- Rama inferior -->
  <path d="M16 26C18 34 21 35 25 35H28" stroke="url(#neuralGrad)" stroke-width="2.3" stroke-linecap="round"/>
  <circle cx="28" cy="35" r="2.3" fill="#17211f" stroke="#c4f36b" stroke-width="1.8"/>

  <!-- Checkmark de Calidad ascendente -->
  <path d="M22 26L26.5 31C27.4 32 28.8 31.4 29.5 30.3L37.5 15" 
        stroke="url(#neuralGrad)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#neonGlow)"/>

  <!-- Chispa IA en el ápice de validación -->
  <path d="M38.5 7.5C38.5 9.8 37 11.2 34.8 11.2C37 11.2 38.5 12.6 38.5 14.9C38.5 12.6 40 11.2 42.2 11.2C40 11.2 38.5 9.8 38.5 7.5Z" 
        fill="#c4f36b" filter="url(#neonGlow)"/>
</svg>